# Original numeric layout using librime spelling algebra; same licensed dictionary.
schema:
  schema_id: lens_nine
  name: 观微九宫拼音
  version: '0.1'
switches:
  - name: ascii_mode
    reset: 0
engine:
  processors:
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - abc_segmentor
    - fallback_segmentor
  translators:
    - script_translator
speller:
  alphabet: '23456789'
  delimiter: " '"
  algebra:
    - xlit/abcdefghijklmnopqrstuvwxyz/22233344455566677778889999/
translator:
  dictionary: pinyin_simp
  prism: lens_nine
  enable_user_dict: false
  enable_sentence: true
menu:
  page_size: 6
