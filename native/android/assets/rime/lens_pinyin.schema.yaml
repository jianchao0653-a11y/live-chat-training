# Original frontend configuration. Dictionary is the unmodified Apache-2.0
# rime-pinyin-simp dictionary; all composition/search algorithms are librime.
schema:
  schema_id: lens_pinyin
  name: 观微简体拼音
  version: '0.1'
switches:
  - name: ascii_mode
    reset: 0
engine:
  processors:
    - ascii_composer
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - abc_segmentor
    - fallback_segmentor
  translators:
    - script_translator
speller:
  alphabet: abcdefghijklmnopqrstuvwxyz
  delimiter: " '"
translator:
  dictionary: pinyin_simp
  enable_user_dict: false
  enable_sentence: true
menu:
  page_size: 6
