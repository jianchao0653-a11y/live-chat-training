plugins { id 'com.android.application' version '8.13.2' }

def staging = file('../../runtime/android-package')
layout.buildDirectory = file('../../runtime/android-gradle-build')
android {
    namespace 'com.conversationlens.ime'
    compileSdk 36
    buildToolsVersion '36.0.0'
    ndkVersion '28.2.13676358'
    defaultConfig { applicationId 'com.conversationlens.ime'; minSdk 26; targetSdk 36; versionCode 21; versionName '0.17.3'; testInstrumentationRunner 'com.conversationlens.ime.OcrTestRunner' }
    defaultConfig { ndk { abiFilters.addAll(file("${staging}/jni").listFiles().findAll { it.isDirectory() }.collect { it.name }) } }
    sourceSets { main { manifest.srcFile "${staging}/AndroidManifest.xml"; java.srcDirs = ['java']; res.srcDirs = ['res']; assets.srcDirs = ["${staging}/assets"]; jniLibs.srcDirs = ["${staging}/jni"] } }
    sourceSets { androidTest { java.srcDirs = ['ocrTest'] } }
    signingConfigs { debug { storeFile file('../../runtime/android-tools/lens-local-debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
    buildTypes { debug { versionNameSuffix '-preview' }; release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    packaging { jniLibs { useLegacyPackaging false } }
}
dependencies { implementation 'com.google.mlkit:text-recognition-chinese:16.0.1' }
dependencyLocking { lockAllConfigurations() }
