android.useAndroidX=true
# CMake/Ninja already build through the ASCII junction; AGP only packages here.
# AGP's own diagnostic documents this override. Validate packaging before release.
android.overridePathCheck=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.daemon=false
