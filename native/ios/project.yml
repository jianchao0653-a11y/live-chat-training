name: ConversationLens
options:
  bundleIdPrefix: com.conversationlens
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: ''
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 0.15.1
    CURRENT_PROJECT_VERSION: 16
targets:
  ConversationLens:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.conversationlens.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 观微
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_LensAppGroup: group.com.conversationlens.shared
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
    dependencies:
      - target: LensKeyboard
        embed: true
  LensKeyboard:
    type: app-extension
    platform: iOS
    sources: [Keyboard, Shared]
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: 观微建议键盘
        LensAppGroup: group.com.conversationlens.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: zh-Hans
            RequestsOpenAccess: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.conversationlens.app.keyboard
        CODE_SIGN_ENTITLEMENTS: Keyboard/Keyboard.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
  LensCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests, Shared]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.conversationlens.tests
  LensUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: ConversationLens
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.conversationlens.uitests
schemes:
  ConversationLens:
    build:
      targets:
        ConversationLens: all
        LensCoreTests: [test]
        LensUITests: [test]
    test:
      targets: [LensCoreTests, LensUITests]
