name: Mobile synthetic acceptance
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  service:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: node app/evals/run.mjs --mode local
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: service-evidence
          path: output/evals/
          retention-days: 7
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [34, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install pinned build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - uses: actions/cache@v4
        with:
          path: runtime/native-sources
          key: rime-${{ runner.os }}-${{ hashFiles('native/dependencies.lock.json') }}
      - run: python3 native/scripts/prepare_sources.py
      - run: python3 native/scripts/build_android.py --abis x86_64
      - run: python3 native/scripts/build_qa.py
      - name: Run official Android emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          emulator-port: 5556
          disable-animations: true
          script: python3 native/scripts/ci_android.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-api-${{ matrix.api }}
          path: |
            output/native/*.json
            output/native/*.png
            output/native/*.xml
            output/native/*.txt
            output/native/*debug.apk
          retention-days: 7
  ios:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen --version
          xcodegen generate --spec native/ios/project.yml --project native/ios
      - name: Build and test on iOS Simulator
        run: python3 native/scripts/ci_ios.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-evidence
          path: |
            output/ios/receipt.json
            output/ios/launch.png
            output/ios/Tests.xcresult
          retention-days: 7
