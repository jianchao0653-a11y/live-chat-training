name: Mobile synthetic acceptance
on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Explicit cloud validation scope (consumes hosted quota)'
        required: true
        default: service
        type: choice
        options: [service, android, ios, all]
permissions:
  contents: read
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  service:
    if: inputs.scope == 'service' || inputs.scope == 'all'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: node app/evals/run.mjs --mode local
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: service-evidence
          path: output/evals/
          retention-days: 7
  android:
    if: inputs.scope == 'android' || inputs.scope == 'all'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [34, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install pinned build tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"'
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: |
            runtime/native-sources
            runtime/native-build-ascii/x86_64
          key: rime-build-${{ runner.os }}-${{ hashFiles('native/dependencies.lock.json', 'native/android/CMakeLists.txt', 'native/scripts/build_android.py') }}
      - run: python3 native/scripts/prepare_sources.py
      - run: python3 native/scripts/build_android.py --abis x86_64
      - uses: actions/cache/save@v4
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: |
            runtime/native-sources
            runtime/native-build-ascii/x86_64
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - run: python3 native/scripts/build_qa.py
      - run: python3 native/scripts/test_policy.py
      - name: Run official Android emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          emulator-port: 5556
          disable-animations: true
          script: |
            python3 native/scripts/ci_android.py
            python3 native/scripts/stability_qa.py
            python3 native/scripts/build_android.py --abis x86_64 --cloud-url http://127.0.0.1:4317
            python3 native/scripts/ci_cloud.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-api-${{ matrix.api }}
          path: |
            output/native/*.json
            output/native/*.png
            output/native/*.xml
            output/native/*.txt
            output/native/*debug.apk
          retention-days: 7
  ios:
    if: inputs.scope == 'ios' || inputs.scope == 'all'
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen --version
          xcodegen generate --spec native/ios/project.yml --project native/ios
      - name: Build and test on iOS Simulator
        run: python3 native/scripts/ci_ios.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-evidence
          path: |
            output/ios/receipt.json
            output/ios/launch.png
            output/ios/app-simulator.tar.gz
            output/ios/Tests.xcresult
            output/ios/screenshots/
          retention-days: 7
